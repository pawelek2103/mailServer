protocols = imap
listen = *

# Public-facing variant: TLS required, plaintext auth disabled.
ssl = required
ssl_cert = </etc/letsencrypt/live/mail.example.com/fullchain.pem
ssl_key = </etc/letsencrypt/live/mail.example.com/privkey.pem
disable_plaintext_auth = yes
auth_mechanisms = plain login

mail_location = maildir:/var/lib/mailreceiver/maildir

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=mailrecv gid=mailrecv home=/var/lib/mailreceiver
}
