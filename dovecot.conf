protocols = imap
listen = *
port = 143

# Plaintext IMAP is acceptable here: this listener is only reachable over
# Railway's private network (or localhost on a VPS). Do not expose 143 publicly.
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

mail_location = maildir:/data/maildir

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=root gid=root home=/data
}

log_path = /dev/stderr
